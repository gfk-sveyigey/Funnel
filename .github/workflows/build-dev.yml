name: Build (dev)

on:
  push:
    branches: [dev]
    paths-ignore: [VERSION]
  workflow_dispatch:

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate Info.plist
        run: |
          set -euo pipefail
          plutil -lint Info.plist
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" Info.plist)
            if [ "$value" != "true" ]; then
              echo "::error::Info.plist $key must be <true/> (got '$value')"
              exit 1
            fi
          done

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -project Funnel.xcodeproj -scheme Funnel -derivedDataPath build -resolvePackageDependencies

      - name: Build (Debug, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Funnel.xcodeproj \
            -scheme Funnel \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Funnel.app Payload/
          zip -qry "Funnel-${{ steps.version.outputs.value }}-dev-unsigned.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funnel-dev-unsigned-ipa
          path: Funnel-*-dev-unsigned.ipa
          retention-days: 14
